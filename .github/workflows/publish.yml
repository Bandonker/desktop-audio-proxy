name: Publish to NPM

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  native-smoke:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package and native renderer
        run: npm run build:native-smoke

      - name: Run Electron host smoke
        run: node scripts/native-smoke-harness.mjs electron

      - name: Compile and run Tauri 2 host smoke
        shell: pwsh
        run: |
          cargo build --manifest-path test/native/tauri/src-tauri/Cargo.toml
          node scripts/native-smoke-harness.mjs tauri

      - name: Install and run Playwright WebKit smoke
        shell: pwsh
        run: |
          npx playwright install webkit
          node scripts/webkit-smoke-test.mjs

  publish:
    runs-on: ubuntu-latest
    needs: native-smoke
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Validate release identity
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${DISPATCH_VERSION#v}"
          fi

          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Lint quality gate
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build project
        run: npm run build

      - name: Validate package exports
        run: npm run verify:exports

      - name: Validate public TypeScript declarations
        run: npm run verify:types

      - name: Validate examples and documentation
        run: |
          npm run verify:examples
          npm run verify:docs

      - name: Verify package contents
        run: npm run verify:package

      - name: Publish to NPM
        run: npm publish

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "${{ github.event_name }}" = "push" ]; then
            EXTRA_ARGS+=(--verify-tag)
          else
            EXTRA_ARGS+=(--target "${{ github.sha }}")
          fi

          gh release create "${{ steps.release.outputs.tag }}" \
            --title "Release ${{ steps.release.outputs.tag }}" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
